uid: SR-0079
type: system_requirement
status: ratified
title: Every signature an item carries is listed in the pane
text: Beneath the readiness lines the detail pane shall list every signature the
  item carries, oldest first, each as the signer's name with their identifier and
  role where the Tool recorded them, so a reviewer about to add a signature sees
  whose stand beside it. A stale row shall still name whose signature the wording
  has moved out from under, naming every signer where there are several.
rationale: The pane already names the ratifier on a stale row (SR-0030) and shows
  the attributes the signature covers (SR-0076); with several signatures the single
  name understates the record. The words are read from the Tool's published signatures
  and drawn here; nothing about who signed is decided a second time (SR-0057). Who
  pays, nobody.
normative: true
