uid: SR-0090
type: system_requirement
status: proposed
title: v switches the selection screen between favourites, every graph and those
  not yet favourites
text: 'The selection screen shall offer three views: every graph found, the favourites
  only, and the graphs not yet favourites. v shall cycle them in that order. The
  screen shall open on the favourites where at least one graph found is a favourite,
  and on every graph otherwise. The view in force shall be named on the screen with
  how many graphs it shows of how many were found. The order in force (SR-0052) shall
  apply within each view. Changing the view shall keep the highlight on the graph
  it was on where that graph is in the new view, and put it on the first row otherwise.
  A graph unmarked in the favourites view, or marked in the view of those not yet
  favourites, shall leave the view, and the highlight shall stay on the row it occupied,
  or the last row where the list is now shorter. Where a view is empty the screen
  shall say so and name the key that changes it, and Enter shall open nothing. The
  view shall be kept for the sitting, as the order is (SR-0064), and shall not be
  remembered between runs. The footer shall name f and v.'
rationale: 'The three views are the ones the operator named. Opening on the favourites
  when there are any is what makes them one key away at the start of a sitting; opening
  on every graph otherwise keeps the screen exactly as it is for a reviewer who has
  never marked one. The count in the header is what keeps a narrowed view honest:
  the reviewer always sees that more graphs were found than are shown. The view is
  held for the sitting and not between runs for the reason SR-0052 gives for the
  order. Test: with no favourites the screen opens on every graph; with one it opens
  on that one and names the view and the count; v cycles to every graph and then
  to the rest; unmarking in the favourites view removes the row and leaves the highlight
  on a listed row; an empty view says so and Enter opens nothing. Who pays: nobody;
  every view is over graphs already read for SR-0050.'
