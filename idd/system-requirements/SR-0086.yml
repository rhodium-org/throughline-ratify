uid: SR-0086
type: system_requirement
status: ratified
title: A draft row says draft and offers p and D
text: 'A row in throughline''s draft concern shall be drawn as a draft: a glyph of
  its own, marked draft in --list, counted as drafts in the queue summary, and its
  detail pane shall say it is not signed and not counted until agreed, and name p
  with the status it is agreed to and D. The key D shall delete a draft, after asking
  a reason and a confirmation, through throughline''s own delete, and the decision
  report shall record it with its reason. D on any other row shall write nothing
  and say so. The help shall describe the draft concern, p and D, and shall name
  no blocked or unsettled row.'
rationale: 'Before this a draft whose transitions did not reach proposed was drawn
  as blocked, with nothing the reviewer could do about it (SR-0008 on hitl-hci).
  A draft has two ends; the cockpit offers both. Rejected: leaving deletion to the
  command line, which sends the reviewer away from the one place that showed them
  the draft. Who pays: nobody; D was free.'
normative: true
