  content:
    type: system_requirement
    text: 'A worklist row that p can put forward (SR-0085) shall be drawn as not
      yet proposed rather than as blocked: the row and --list shall carry a glyph
      of its own, --list shall mark it not-yet-proposed, the queue summary shall
      count it apart from the blocked rows, and the detail pane shall say it is not
      yet proposed and that p puts it forward to the proposed status, naming that
      status. The help shall describe the key p, and its legend shall describe not
      yet proposed and blocked separately, blocked being an item no move the project
      permits lets anyone sign now or one that went past ratified without a sign-off.
      The concern recorded on the row remains the one throughline gives.'
