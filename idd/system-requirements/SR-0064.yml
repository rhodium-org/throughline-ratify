uid: SR-0064
type: system_requirement
status: ratified
title: The selection screen comes back where the reviewer left it, with its figures
  read again
text: When the selection screen is shown again after a graph has been closed, the
  highlight shall rest on the graph that was just closed and the candidates shall
  be in the order the reviewer last chose. Each candidate's ratification figure shall
  be brought up to date from its own registers before the screen is drawn, reading
  again those whose own files have changed (SR-0095), under the same progress display
  as the first reading. The list of candidates shall be the one found when the program
  started; the search beneath the path shall not be repeated. No candidate's declared
  sources shall be resolved in order to show the screen again.
rationale: |-
  The reviewer has just signed items in one of these graphs, so the figure on its row is the one fact on the screen known to be out of date. Showing the old figure would have the screen and the worklist disagree about the same number, which SR-0050 exists to prevent.

  Keeping the highlight and the order means the next graph down is one key away. A screen that reset to the top in path order would make the reviewer find their place again after every graph.

  The search is not repeated because it asks the version control system which directories it ignores, which starts a process, and the set of graphs in a repository does not change in the course of a sitting in any way the reviewer cannot recover from by starting again.

  Who pays: the reviewer, who waits for the candidates to be read once for every graph they close. The reading is of files on disk only.
