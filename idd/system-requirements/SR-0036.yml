uid: SR-0036
type: system_requirement
status: implemented
title: CODE_OF_CONDUCT.md is the Contributor Covenant with a real contact on it
text: A CODE_OF_CONDUCT.md at the repository root shall adopt the Contributor Covenant
  version 2.1, attributed to its source, and shall name the person answerable for
  enforcement together with the private route by which a breach reaches them. A code
  of conduct whose enforcement section names nobody is decoration.
