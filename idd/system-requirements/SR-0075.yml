uid: SR-0075
type: system_requirement
status: ratified
title: The help screen scrolls, so every line of it can be read on any terminal the
  cockpit runs in
text: Where the help is longer than the screen is tall, the help screen shall open
  at the top and let the reviewer move through it a line at a time with the keys
  that move through the worklist, a screenful at a time with the page keys and the
  space bar, and to either end with the keys that jump to the ends of the worklist.
  Its last row shall say how to close it and how to scroll, and whether there is
  more above, below or both; where the screen is too narrow for all of that, how
  to close it shall be cut last. Where the whole help fits, the last row shall say
  only how to close it. The q key, Escape and the question mark shall close the help.
  Any other key shall leave it open and shall do nothing else. A change in the size
  of the terminal while the help is open shall leave every line reachable.
rationale: |-
  Found on 8 October 2026 while fixing the footer (SR-0073). The help is some 45 lines and was drawn from the top with nothing to move it. On a terminal 24 rows high, the default, it stopped just after the line for the quit key, so the keys of the detail pane and the legend that explains the worklist's icons were never shown and no key reached them. SR-0073 made that matter more: a narrow footer names keys by symbols and leaves some out, on the understanding that the help lists every key with its symbol.

  The operator chose scrolling over the alternatives. Two columns on a wide screen was rejected as two layouts to keep right, with scrolling still needed on a narrow one. Shortening the help to fit 24 rows was rejected because it loses the explanations and a shorter terminal still cuts it off. Showing only the keys of the pane in focus was rejected because the reviewer could no longer read everything in one place.

  The scroll keys are the worklist's own so there is nothing new to learn.

  Any key used to close the help. The operator chose that only q, Escape and the question mark close it, so that a stray key does not throw the reviewer out while they are reading. The question mark is included because it is the key that opened the help. Other keys do nothing because a key that acted on the worklist from behind the help would take a decision on an item the reviewer cannot see.

  How to close comes first on the last row because that row is cut at the right-hand edge on a narrow screen, as the footer was before SR-0073, and the way out is the part that must survive.

  Test: open the help on a screen 24 rows by 80 columns. Expect the first line of the help at the top, the last row to say there is more below and how to close, and the legend of concerns not to be shown. Page down until the end and expect every line of the help to have been shown, the detail pane's keys and the concerns among them. Expect the line keys to move one line, the ends to hold, and the last row to say which way there is more. Press a key that signs and expect the help still open and no file changed. Press q, Escape and the question mark in turn and expect each to close it. Open it on a screen taller than the help and expect it whole, with a last row that says only how to close it.

  Who pays: a reviewer used to closing the help with any key has to learn that three keys do.
