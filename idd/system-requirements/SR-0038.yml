uid: SR-0038
type: system_requirement
status: ratified
title: The declared dependency range is tested at both ends on a schedule
text: 'The repository shall run its unit tests and its graph gate on a recurring
  schedule, independently of any commit, against two resolutions of its declared
  dependency range: the versions the package index currently publishes, and the exact
  declared minimums. The minimum versions installed shall be derived from the package
  metadata rather than restated in the workflow. The schedule shall place the run
  outside the maintainers'' working hours.'
rationale: 'throughline and throughline-compose are declared as floors rather than
  locked, so continuous integration resolves whatever the index happens to publish
  and a green check is only true on the day it ran. This repository is the most exposed
  of the three because it sits on both: the cockpit is ours, but every judgement
  it reports comes from a validator we do not ship, so a release of either can turn
  this repository red without a commit here. Nothing observes that in between. The
  failure surfaces when a contributor next opens a pull request, who meets a break
  that has nothing to do with their change and must diagnose someone else''s drift
  before their own work can be judged — which is precisely the barrier UR-0008 exists
  to remove, arriving from outside the repository rather than from a gap in its documentation.
  That is not hypothetical: on 2026-08-09 throughline 1.13 shipped a rule this graph
  did not satisfy. Testing the two ends catches opposite faults. The ceiling catches
  a dependency that has moved ahead of us. The floor catches a minimum declared but
  no longer actually supported — the fault that follows from pinning a version on
  the strength of ''it has the API we call'' alone, which this repository has done.
  Deriving the minimums from the package metadata rather than restating them keeps
  the workflow from drifting away from the versions the package actually promises,
  which would leave a green floor job proving nothing. Who pays: maintainers, who
  receive failures no commit of theirs caused. That is the intent — the alternative
  is not the absence of the failure but its arrival in a newcomer''s pull request,
  attributed to their change. The scheduled hour is offset from the top of the hour
  because scheduled jobs queue heavily there, and placed outside working hours so
  a red result waits rather than interrupts. Rejected: locking the dependencies,
  which trades this failure for a silent staleness nothing observes at all; and requiring
  branches to be up to date with the base before merging, which addresses a different
  drift and would not have caught the 2026-08-09 break.'
