uid: SR-0085
type: system_requirement
status: ratified
title: A draft is agreed with p, never signed by r
text: 'A row in throughline''s draft concern shall not be signed. The key p shall
  agree it: move it, through throughline''s own status operation and taking no signature,
  to the status throughline names for it (agree_to), and the decision report shall
  record that it was agreed, from and to which status. r on a draft shall refuse
  in throughline''s own words. p on any other row, or on a draft throughline names
  no status for, shall write nothing and say so, naming D for the latter.'
rationale: 'A draft is agreed or deleted, never signed (throughline SR-0307). Which
  status it is agreed to is throughline''s judgement, so the cockpit and table.iddn.uk
  offer the same move. Rejected: carrying a draft to ratified in one key, which joins
  agreeing and signing, two acts. Who pays: nobody new; p kept its key.'
normative: true
