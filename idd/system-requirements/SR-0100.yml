uid: SR-0100
type: system_requirement
status: ratified
title: The worklist can be ordered by when each item was last signed, newest first
text: In addition to the default ordering, the operator can re-sort the queue by
  the time of each item's newest signature, newest first, so that in the wide view
  they can read back what they have just signed. Items whose signatures carry no
  time follow those whose signatures do, and items never signed come last. Items
  signed at the same time keep the default order among themselves.
rationale: 'Asked for on 28 November 2026 after signing a batch in another graph:
  the operator wanted to read back what they had just signed, and no ordering put
  it together. Signatures backfilled from the older record carry no time, so they
  cannot be placed among the dated ones and are put after them, still ahead of the
  unsigned. The order shows signed items only in the wide view (''a'', or --all with
  --list), which already exists; the sort does not widen the view by itself. Who
  pays: nobody beyond one more entry in the sort cycle.'
normative: true
