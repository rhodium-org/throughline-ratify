uid: SR-0039
type: system_requirement
status: ratified
title: The decisions the cockpit offers are importable without a terminal
text: 'The module in which the worklist is built and every decision is taken shall
  be importable and usable on its own, without importing curses and without running
  a subprocess, except that where the graph sits in a git work tree it may ask git
  for the last commit, through throughline, to judge a status move as tl check does
  (SR-0097). Everything the cockpit can decide shall be decidable through it: the
  ordered worklist and its counts, the concerns each item is in, ratification by
  a named person, the walk to ratification for an item that overshot it, the preview
  of what a refusal unsettles, the refusal itself, the removal of a link, and the
  record of the sitting. The full-screen view shall be one caller of that module
  rather than the place the decisions live. A test shall assert the import, so a
  terminal-only dependency reintroduced anywhere on that path is caught rather than
  discovered by whoever imported it.'
normative: true
links:
- target: INT-0002
  type: derives_from
attrs:
  priority: should
  verification: The decision module is imported in a process where curses is absent
    from sys.modules and importing it fails; the import succeeds and no subprocess
    is created. The test is part of the unit suite.
  origin: ai
