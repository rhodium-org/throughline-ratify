uid: SR-0013
type: system_requirement
status: ratified
title: The detail pane is focusable and its links can be navigated and expanded to
  read referenced content
text: Pressing Tab moves focus between the worklist and the detail pane. With the
  detail pane focused, the up and down keys move a cursor over the selected item's
  links, and expanding a link reveals the referenced item's full content — its type,
  status and body — resolved over the composed union, so a borrowed source clause
  can be read in place. Tab or Escape returns focus to the worklist.
normative: true
