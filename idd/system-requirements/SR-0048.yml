uid: SR-0048
type: system_requirement
status: ratified
title: The reviewer picks the graph from a list, and only the picked graph is opened
text: Where more than one graph is found and tl-ratify is running interactively on
  a terminal, it shall show a selection screen before the worklist. The screen shall
  list each candidate in a stable order, naming the project and its path relative
  to the path given. The reviewer shall move and choose using the keys the cockpit
  already binds, and shall be able to leave without choosing, which restores the
  terminal and exits taking no decision, as SR-0016 requires of an interrupt. Only
  the chosen graph shall be loaded and composed; tl-ratify shall not read or resolve
  the sources of a graph the reviewer did not pick.
rationale: The selection screen belongs in the cockpit rather than in a plain prompt
  before curses opens, because the reviewer is about to spend the sitting in the
  cockpit and a second interaction model to learn first is friction with nothing
  behind it. Leaving without choosing has to be as ordinary as quitting the worklist,
  since a reviewer who pointed the tool at the wrong tree learns that from this screen.
  The lazy-open rule is the load-bearing part. Composing a graph resolves its declared
  sources, which for a remote source means the network, so eagerly opening every
  candidate in order to decorate the list with item counts would make the screen
  slow, would fail when an unrelated graph's source is unreachable, and would fetch
  on behalf of a reviewer who never asked for that project. The counts would be genuinely
  useful, and they are given up for that reason. This screen takes no ratification
  decision and so does not approach NG-0001; it chooses what to read, not what to
  sign. The cost falls on the reviewer, who reaches the worklist one keystroke later
  than before, and only when the path they gave was ambiguous.
