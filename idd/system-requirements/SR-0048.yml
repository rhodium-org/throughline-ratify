uid: SR-0048
type: system_requirement
status: implemented
title: The reviewer picks the graph from a list, and only the picked graph is opened
text: Where more than one graph is found and tl-ratify is running interactively on
  a terminal, it shall show a selection screen before the worklist. The screen shall
  list each candidate in a stable order, naming the project and its path relative
  to the path given. The reviewer shall move and choose using the keys the cockpit
  already binds, and shall be able to leave without choosing, which restores the
  terminal and exits taking no decision, as SR-0016 requires of an interrupt. Only
  the chosen graph shall be composed; tl-ratify shall not resolve the declared sources
  of a graph the reviewer did not pick. A candidate's own registers may be read in
  order to describe it on the screen.
rationale: |-
  The selection screen belongs in the cockpit rather than in a plain prompt before
  curses opens, because the reviewer is about to spend the sitting in the cockpit and
  a second interaction model to learn first is friction with nothing behind it.
  Leaving without choosing has to be as ordinary as quitting the worklist, since a
  reviewer who pointed the tool at the wrong tree learns that from this screen.

  The lazy-compose rule is the load-bearing part. Composing a graph resolves its
  declared sources, which for a remote source means the network, so composing every
  candidate would fetch on behalf of a reviewer who never asked for that project and
  would fail the whole screen when one unrelated graph's origin was unreachable.

  Reading a candidate's own registers does neither. It touches only files already on
  disk beneath the path the reviewer gave, and it resolves nothing. That distinction
  is what UR-0014 rests on: the screen can say how far a graph has been signed off
  without resolving anything on its behalf, and what is ratifiable now is left to the
  worklist, which has the union to answer it with. An earlier draft of this item drew
  the line at loading rather than at composing and so gave up the counts altogether;
  the counts were always worth having, and the line was in the wrong place.

  This screen takes no ratification decision and so does not approach NG-0001; it
  chooses what to read, not what to sign. The cost falls on the reviewer, who reaches
  the worklist one keystroke later than before, and only when the path they gave was
  ambiguous.
normative: true
