uid: SR-0034
type: system_requirement
status: implemented
title: CONTRIBUTING.md carries the whole path from clone to pull request
text: A CONTRIBUTING.md at the repository root shall state how to install the package
  for development, how to run the tests, and how to run this repository's own requirements
  gate — naming tl 3.11.0 or later, because the graph composes a source and a tl
  older than 3.11.0 cannot resolve it. It shall state that a change is grounded in
  an idd/ item before it is built and that the item's UID is cited in the commit,
  and shall record the terms a contribution is offered under. Where the contributor
  is also working on throughline it shall point at the chained editable install,
  because a cockpit running against a published validator reports figures that disagree
  with the gate and is indistinguishable from a real defect.
rationale: The gate a contributor is told to run has to be the one that composes
  this graph's source, or the first namespace-qualified reference stops it and the
  contributor meets a failure that is not theirs (UR-0008). From throughline 3.11.0
  that gate is tl itself.
normative: true
