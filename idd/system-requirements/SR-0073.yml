uid: SR-0073
type: system_requirement
status: ratified
title: The footer names its keys in the room there is, and never loses the help key
  or the quit key
text: 'The footer of the worklist and of the detail pane shall name each key by a
  word where every key so named fits in the width of the screen. Where the words
  do not fit, it shall name every key by a single-cell symbol in place of its word,
  except the help key and the quit key, which shall keep their words. Where the symbols
  do not fit either, it shall leave keys out one at a time until the rest fit, in
  this order on the worklist: reload, filter, sort, the wide view, the detail pane;
  and on the detail pane, the removal of a link. It shall never leave out the help
  key, the quit key, the keys that move, or on the worklist the keys that sign and
  reject. A key left out of the footer shall still work. The help screen shall show
  each symbol beside the key it stands for.'
rationale: |-
  Found on 8 October 2026 while writing the layout tests for SR-0007. On a terminal 80 columns wide, the default, the worklist's legend ran off the right-hand edge and took the help key and the quit key with it. The legend needs 95 columns in words, and 99 where the quit key leads back to the selection screen. The two keys lost are the ones a newcomer needs first, and SR-0063 has the worklist name the quit key by where it leads, which at the default width it did nowhere.

  The operator chose symbols over leaving keys out, and words wherever they fit. With symbols the whole legend is 62 columns, so nothing is lost at 80. Words are kept on a wide screen because a symbol has to be learned and a word does not. The legend is all words or all symbols, never a mix, so it is read one way at a time.

  The symbols are single cells because a wider character, an emoji for instance, is drawn at different widths by different terminals, and the footer's own measure of what fits would then be wrong. The operator asked for a thumbs up for signing and a speech bubble for help. Both exist only as wide characters, so signing takes the tick the cockpit already uses for a ratified item, and help keeps its word.

  Help and quit keep their words because the question mark already reads as help, and because the quit key's name is information: it says whether the key ends the program or goes back to the selection screen.

  Reload is the first key left out because the cockpit reloads by itself (SR-0062). Filter, sort and the wide view follow because each changes what is listed and none is needed to take a decision. The detail pane goes last of those because it is how a reviewer reads what an item is linked to before signing it.

  Shortening the legend by leaving keys out as soon as the words did not fit was rejected: it hides keys at the commonest width. A second row for the footer was rejected because it costs a row of the worklist on the terminals that have fewest.

  Test: draw the worklist at 80 columns and expect every key named, by a symbol, with help and quit in words, for both names of the quit key. Draw it at each width from 40 to 130 and expect the footer to fit, to name help and quit, and to name the keys that move, sign and reject. Find the widest screen at which each of the other keys is left out and expect the order above. Press a key the footer has left out and expect it to act. Open the help screen and expect each symbol beside its key.

  Who pays: a reviewer on a narrow screen meets symbols they have to look up once. Below about 62 columns some keys are not named in the footer at all, and are found on the help screen.
