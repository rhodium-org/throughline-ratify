uid: SR-0094
type: system_requirement
status: ratified
title: The search for graphs at start shows how far it has got
text: While tl-ratify searches beneath the paths given for graphs, and it is running
  on a terminal, it shall show on standard error that it is searching, the path it
  is searching beneath, how many directories it has looked in and how many graphs
  it has found so far, on one line rewritten as the count moves and at least once
  a second while the search goes on. The line shall be cleared before the selection
  screen or the worklist is drawn and before any refusal is printed. Under --list,
  or where standard error is not a terminal, nothing shall be shown. Pointing at
  a graph directly involves no search and shows nothing.
rationale: 'Seen by the operator on 1 November 2026: started over 01-applications
  and 04-throughlines, tl-ratify showed nothing for about seven seconds while it
  walked the trees and asked git which directories it ignores, and read as hung.
  SR-0051 already shows progress while candidates are read; the search before it
  had none. The count is the honest measure, because how many directories remain
  is not known until the walk ends. On standard error and before the full-screen
  view, because the view cannot open until the search has said whether there is anything
  to choose between (SR-0045). Rejected, opening the full-screen view first: a search
  that finds one graph opens it directly, and one that finds none is refused on the
  terminal, so a view opened only to be closed again would flash. Test: a search
  over a tree on a terminal writes a line naming the path and the counts and clears
  it; with --list, or standard error not a terminal, nothing is written; naming a
  graph directly writes nothing. Who pays: nobody.'
normative: true
