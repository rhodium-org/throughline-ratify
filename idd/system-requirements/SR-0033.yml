uid: SR-0033
type: system_requirement
status: implemented
title: A reload shows itself before it blocks, not after it returns
text: Before the cockpit begins reloading the graph from disk it shall paint a visible
  in-progress state and flush it to the terminal, then perform the read, then repaint
  the refreshed worklist. The indication is therefore on screen for the duration
  of the blocking read, rather than a flash message that can only appear once the
  read has already returned.
