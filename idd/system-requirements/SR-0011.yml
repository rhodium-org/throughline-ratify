uid: SR-0011
type: system_requirement
status: ratified
title: The worklist can be ordered by grounding depth, roots-first or leaves-first
text: In addition to the default most-actionable-first ordering, the operator can
  re-sort the queue by each item's grounding depth — either roots-first (shallowest,
  closest to intent, at the top) or leaves-first (deepest first) — so a large graph
  can be worked top-down or bottom-up. Ungrounded items sort last in either direction.
