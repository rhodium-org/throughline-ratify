[project]
name = "throughline-ratify"
format_version = 3

# This cockpit is a client of throughline: it does not define what a ratification
# record is, it writes one by calling throughline's own ratify (SR-0022). Until now
# that dependency lived only in prose, so a clause could be cited in a rationale
# while nothing checked the clause still said what the citation claimed. Composing
# throughline's own graph as a source makes the dependency a fact the validator
# holds: a requirement here may point at the upstream clause it tracks, that
# reference is resolved against the pinned edition, and an obligation stated
# upstream cannot quietly vanish from this side. The pin is a tag, so the wording
# under a citation only ever moves when this line moves.
#
# The namespace is 'tl' — the name the tool already answers to, and the one a
# reference is actually read under. A qualified reference is a thing people type
# and read aloud, so 'tl:SR-0157' beats 'throughline:SR-0157'; the longer form also
# reads as noise inside a project already called throughline-ratify. The namespace
# is the importer's choice, not the source's, which is exactly what it is for.
#
# subdir is 'idd' because throughline keeps its own graph there, as this repo does.
# Note that a moved ref is NOT refetched — bumping this needs the cached tree for
# the old ref cleared, or the check silently passes against stale content.
[[sources]]
namespace = "tl"
url = "https://github.com/rhodium-org/throughline"
ref = "v1.13.2"
subdir = "idd"

# Everything below is THIS project's own model, and nothing else is in it.
#
# Adopting the source above costs the [[sources]] block and no more
# (throughline-compose SR-0026, shipped in 0.10.0): a finding whose only remedy
# lies in the graph that owns a borrowed item is no longer raised here, so this
# schema is no longer obliged to be a superset of throughline's. The declarations
# that used to sit below purely to admit the source's business needs, NFRs,
# deferred status and assumes/implements/verifies/mitigates links have gone with
# it. They were inert and unattributed, wrong the moment the pin moved, and — being
# permissive — able to accept a borrowed item the source's own graph would reject.
# Nothing here is widened for the source now, so nothing here needs marking as
# such: read every line below as this project's own model, because it is.
[grounding]
root_types = ["intent", "non_goal"]
# non_goal is a root too, but deliberately NOT a delivery root — a recorded
# non-goal is negative space, so nothing derives from it and it is never flagged
# unserved. It is passive: the tool never tries to detect items that 'violate' one.
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "refines"]
ai_origins = ["ai", "hybrid"]

[types.intent]
attrs.origin = { type = "enum", values = ["human", "ai", "hybrid"] }

# Deliberately-excluded scope, recorded so it is visible to reviewers and agents
# rather than living only in prose.
[types.non_goal]
attrs.origin = { type = "enum", values = ["human", "ai", "hybrid"] }

# origin is the only attribute this project's requirements carry. priority and
# verification are the source's, and are deliberately not adopted along with it:
# the source marks priority normative, so mirroring the declaration would put it
# in the content fingerprint and report all of this project's own ratified items
# as drifted on wording nobody had touched. throughline SR-0162 carries the
# authoring graph's normative set with each borrowed item, so the source's stamps
# stay valid without this graph having to take the source's view of what counts as
# a change to a requirement.
[types.user_requirement]
attrs.origin = { type = "enum", values = ["human", "ai", "hybrid"] }

[types.system_requirement]
attrs.origin = { type = "enum", values = ["human", "ai", "hybrid"] }

[links]
# satisfies is the borrowed-clause link — one of our requirements tracks a clause
# of the source's, and is the whole reason this graph composes anything at all.
types = ["derives_from", "refines", "relates", "satisfies"]

[link_rules]
derives_from = { from = ["user_requirement", "system_requirement"], to = ["intent", "user_requirement"] }
refines      = { from = ["system_requirement"], to = ["system_requirement"] }
# The traceability link, deliberately NOT a grounding link: a requirement here
# still grounds through derives_from to one of this project's own intents, never
# through the source. What satisfies records is that the two are talking about the
# same obligation, so a reader can go and read the other half of it.
satisfies    = { from = ["system_requirement"], to = ["system_requirement", "user_requirement"] }

[status]
values = ["proposed", "draft", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

# 'proposed' and 'draft' reach 'suspect' because that is where the least settled
# items sit: without the route, withdrawing their footing would leave them carrying
# no record of it. These two are judged because local items actually hold them, not
# merely because the status vocabulary names them (tl:SR-0177).
[transitions]
proposed    = ["draft", "approved", "ratified", "suspect", "rejected", "deleted"]
draft       = ["approved", "ratified", "suspect", "rejected", "deleted"]
approved    = ["ratified", "implemented", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
