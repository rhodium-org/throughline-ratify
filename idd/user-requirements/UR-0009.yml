uid: UR-0009
type: user_requirement
status: ratified
title: A vulnerability can be reported without first disclosing it
text: A person who believes they have found a security defect shall find a stated
  private route for reporting it, and shall know what response to expect. The public
  issue tracker shall not be the only channel, so reporting a defect responsibly
  never requires publishing it first.
normative: true
