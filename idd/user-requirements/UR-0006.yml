uid: UR-0006
type: user_requirement
status: ratified
title: A contribution states the terms under which it is offered
text: Every commit offered to this project carries a Developer Certificate of Origin
  sign-off naming its author. A contribution whose commits do not carry one is not
  accepted, so the project never holds work whose provenance it cannot evidence.
normative: true
