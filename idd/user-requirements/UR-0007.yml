uid: UR-0007
type: user_requirement
status: ratified
title: Know that a reload is running, not that the tool has hung
text: Reloading the graph from disk (R) can take long enough that the cockpit looks
  frozen. While a reload is running the cockpit shall show the reviewer that it is
  working, so they wait for it rather than assume the tool has stopped responding.
normative: true
