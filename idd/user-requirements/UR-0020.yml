uid: UR-0020
type: user_requirement
status: ratified
title: Ratify a proposed deletion from the cockpit, knowing what it undoes and what
  it marks suspect
text: As a reviewer, I want a tombstone whose deletion awaits a signature offered
  to me as the deletion it is, to read the record I am signing — why, when, what
  the item said and whose acceptance it undoes — and to be told before I sign which
  items will be marked suspect and afterwards which were and which could not be,
  so that retiring an item is as deliberate an act as accepting one and nothing grounded
  on it loses its footing unseen.
rationale: 'throughline 4.1.0 makes deletion a ratified act (throughline SR-0267
  to SR-0270): tl delete leaves a proposed tombstone, the signature on it is over
  the deletion record, and the one that retires the item marks everything grounded
  on it suspect. The Tool refuses to sign such a deletion unless the caller receives
  that cascade, so a cockpit built before the rule failed loudly on any tombstone
  with dependents rather than sign a deletion whose consequences it never wrote.
  Rejected, hiding tombstones from the cockpit until signed elsewhere: the cockpit
  exists to put every item awaiting a human in front of one. Who pays, a reviewer
  meets one more kind of proposal and reads a record instead of wording; a graph
  with no tombstones sees nothing new.'
