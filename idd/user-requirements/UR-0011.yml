uid: UR-0011
type: user_requirement
status: ratified
title: The published distribution passes the suite it ships
text: A person who installs throughline-ratify from a package index shall be able
  to run the test suite that distribution ships and have it pass, so the package
  they are vetting visibly upholds the discipline this cockpit exists to enforce
  rather than presenting errors the moment it is examined. The published artifact
  shall not ship a test suite it cannot itself run green.
normative: true
