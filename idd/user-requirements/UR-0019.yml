uid: UR-0019
type: user_requirement
status: ratified
title: Sign in the role the graph declares, and see who has signed before me
text: As a reviewer of a graph that declares roles, I want to sign in my role, to
  see every signature an item already carries and what its kind still requires, and
  to be told plainly when the role or identifier a signature needs is missing, so
  that a second signature is given knowingly and a graph that declares no roles costs
  me nothing new.
rationale: throughline 4.0.0 holds an item's ratification record as a list of signatures
  and lets a graph declare roles and what each kind of item requires (throughline
  UR-0039, SR-0254 to SR-0264). A cockpit that drew the old single record would show
  one signer where there are two, draw the Tool's new awaiting concern as a blank,
  and could not sign in a role at all. Who pays, a reviewer of a roles graph names
  the role once per sitting with --as; a reviewer of any other graph sees nothing
  new.
normative: true
