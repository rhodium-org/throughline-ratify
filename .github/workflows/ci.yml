name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
        include:
          # Prove the supported floor (Python >= 3.11).
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (this repo's own requirements must stay grounded)
        # tl-compose, not bare tl (SR-0029). This graph adopts throughline's own as
        # a pinned source so a requirement here can point at the upstream clause it
        # tracks; bare `tl` cannot resolve a namespace-qualified reference and would
        # report that citation as a broken link. The source is fetched from git, so
        # this step needs network access.
        run: tl-compose -C idd check --strict --quiet

      - name: Published spec is current (SR-0042)
        # idd/docs/spec.md is rendered from the graph, so an item edited without
        # regenerating it leaves the document quietly wrong. The completeness half —
        # a live normative item that no document names — is reported by the strict
        # check above, which `[docs] paths` is what switches on.
        run: tl-compose -C idd docs --check

  # The very round-trip that gates publication, run on every change too, so a break
  # is found at the commit that caused it and not after the release (SR-0041).
  sdist-suite:
    uses: ./.github/workflows/sdist-suite.yml
