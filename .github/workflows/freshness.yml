name: freshness

# SR-0038.

# throughline is declared as a floor, not locked, so CI resolves whatever PyPI
# happens to publish. A green check is therefore only true on the day it ran: a
# release of it can turn this repo red without a commit here, and nothing would say so until a contributor next opened a pull request —
# who then meets a failure that has nothing to do with their change. That is not
# hypothetical here; it is what happened on 2026-08-09, when throughline 1.13
# shipped a rule this graph did not satisfy.
#
# This repo is the most exposed of the three because it sits on both: the cockpit
# is ours, but every judgement it reports comes from a validator we do not ship.
# Two ends are worth testing and they fail for opposite reasons: the ceiling
# catches a dependency that has moved ahead of us, the floor catches a minimum we
# have declared but no longer actually support — the floor job is the one that
# would have caught a version pinned on the strength of "it has the API" alone.

on:
  schedule:
    # 03:17 UTC daily — outside UK working hours under both GMT and BST. Offset
    # from the hour because scheduled jobs queue heavily on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    name: latest published dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install, resolving dependencies fresh
        run: pip install -e ".[dev]"

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (this repo's own requirements must stay grounded)
        run: tl -C idd check --strict --quiet

  floor:
    name: declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11" # the lowest interpreter we claim to support

      - name: Install at the declared floor
        # Read the floors out of pyproject rather than restating them here, so
        # this cannot drift from the versions the package actually promises.
        run: |
          # One requirement to a line, in a file: a dependency may carry a marker
          # (windows-curses; sys_platform == 'win32'), whose spaces a shell word
          # split would break into requirements of their own.
          python -c "
          import tomllib
          deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']
          print('\n'.join(d.replace('>=','==', 1) for d in deps))
          " > floor.txt
          echo "installing floor:"; cat floor.txt
          pip install -r floor.txt
          pip install -e . --no-deps
          pip install pytest

      - name: Record what was resolved
        run: pip list

      - name: Unit tests
        run: pytest -q

      - name: Self-host gate (this repo's own requirements must stay grounded)
        run: tl -C idd check --strict --quiet
