[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline-ratify"
version = "0.5.0"
description = "A full-screen, htop-style terminal assistant for reviewing and ratifying throughline requirement items. Compose-aware: grounds items over the composed union so borrowed clauses count. Ships the tl-ratify TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henry J Grech-Cini", email = "henry.grechcini@gmail.com" }]
keywords = [
  "requirements",
  "requirements-management",
  "ratification",
  "review",
  "tui",
  "curses",
  "traceability",
  "grounding",
  "idd",
  "intent-driven-development",
  "throughline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
# throughline-compose re-exports the throughline core it composes over, so this
# single pin gives us both the union engine and the model/grounding APIs.
# ratify's prebuilt-index parameter — how we ground over the composed union while
# writing only to our own registers (SR-0022) — needs throughline>=1.4.0.
# throughline.identity, which decides both who is offered by default (SR-0027) and
# what a stable identifier may look like (SR-0028), arrived in throughline>=1.8.0;
# compose>=0.8.0 requires it. The fingerprint that survives composition unchanged
# (item._authored_normative_attrs, set by the union from the source's own schema)
# — so this graph need not mirror throughline's normative flags to adopt it as a
# source (SR-0029) — needs throughline>=1.9.0, which compose>=0.9.0 requires, so
# pinning the floor there flows all three in transitively. Below it, all 204
# borrowed items report ratified-stale: without the authored set, a borrowed
# item is fingerprinted under this graph's normative flags rather than its own.
# throughline.version.distribution_version, which the header and --version both read
# so a working tree is not shown as the release it derives from (SR-0031), needs
# throughline>=1.10.0, which compose>=0.10.0 requires.
# grounding.Invalidation.marked/.refused, which the reject path reads to report what
# a cascade actually did and what it could not (SR-0037), first ships in 1.13.0.
#
# Every clause above names an API this package calls. compose>=0.13.0 is the one
# that does not, and it is here deliberately, because this block says more than
# which functions the cockpit imports. `pipx install throughline-ratify` is how the
# estate hands someone the whole toolchain — the README and AGENTS.md both say so —
# and ratify sits on top of both packages, so what it declares is the *edition* of
# that toolchain it delivers, not only the symbols it reaches for. 0.13.0 is the
# release in which `tl-compose check` began handing the set of published documents
# to the validator; below it, a project that has configured `[docs] paths` is told
# nothing whatsoever about publication coverage and cannot tell that apart from
# being fully published (compose SR-0038). Shipping someone a cockpit for taking
# accountability over requirements alongside a checker that quietly does not check
# is not a saving worth making, and this repo's own gate (SR-0042) rests on the
# same release.
#
# That floor carries throughline's with it: a floor of compose is only honest at the
# lowest throughline it can itself be installed against, or the declared-minimum
# resolution SR-0038 installs would not resolve at all. So the two move as one.
#
# They move to compose>=0.14.0 / throughline>=2.0.0 because on 2026-08-16 the pair
# became coupled in the other direction too, and the previous floors admitted a
# combination that does not work (SR-0043). throughline 2.0.0 stopped providing
# `tl:sourced` — a directive core could never render, because mirroring a borrowed
# clause needs the composed sources and only compose holds them — and opened a
# registry for a front end to provide one instead; compose 0.14.0 is the release
# that registers it there. Neither half is any use without the other. The floors as
# they stood named 0.13.0 and 1.13.2, both ends of that range resolve to a working
# pair, and (compose==0.13.0, throughline==2.0.0) sits in the interior where nothing
# looked. pip installs it without complaint and then `tl-compose` does not start at
# all — `--version` included — dying on `ImportError: cannot import name
# '_render_item'`, while `tl-ratify` still runs. An upper bound on compose 0.13.0
# would be the narrower fix and is not available, that release being already on the
# index as published, so the floor is what moves.
dependencies = ["throughline-compose>=0.14.0", "throughline>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rhodium-org/throughline-ratify"
Repository = "https://github.com/rhodium-org/throughline-ratify"
Issues = "https://github.com/rhodium-org/throughline-ratify/issues"

[project.scripts]
tl-ratify = "throughline_ratify.cli:main"
throughline-ratify = "throughline_ratify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
