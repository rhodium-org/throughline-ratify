[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline-ratify"
version = "0.4.1"
description = "A full-screen, htop-style terminal assistant for reviewing and ratifying throughline requirement items. Compose-aware: grounds items over the composed union so borrowed clauses count. Ships the tl-ratify TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henry J Grech-Cini", email = "henry.grechcini@gmail.com" }]
keywords = [
  "requirements",
  "requirements-management",
  "ratification",
  "review",
  "tui",
  "curses",
  "traceability",
  "grounding",
  "idd",
  "intent-driven-development",
  "throughline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
# throughline-compose re-exports the throughline core it composes over, so this
# single pin gives us both the union engine and the model/grounding APIs.
# ratify's prebuilt-index parameter — how we ground over the composed union while
# writing only to our own registers (SR-0022) — needs throughline>=1.4.0.
# throughline.identity, which decides both who is offered by default (SR-0027) and
# what a stable identifier may look like (SR-0028), arrived in throughline>=1.8.0;
# compose>=0.8.0 requires it. The fingerprint that survives composition unchanged
# (item._authored_normative_attrs, set by the union from the source's own schema)
# — so this graph need not mirror throughline's normative flags to adopt it as a
# source (SR-0029) — needs throughline>=1.9.0, which compose>=0.9.0 requires, so
# pinning the floor there flows all three in transitively. Below it, all 204
# borrowed items report ratified-stale: without the authored set, a borrowed
# item is fingerprinted under this graph's normative flags rather than its own.
# throughline.version.distribution_version, which the header and --version both read
# so a working tree is not shown as the release it derives from (SR-0031), needs
# throughline>=1.10.0, which compose>=0.10.0 requires.
# grounding.Invalidation.marked/.refused, which the reject path reads to report what
# a cascade actually did and what it could not (SR-0037), first ships in 1.13.0.
# Publication coverage over a composed graph — this repo's own `[docs] paths` making
# an unpublished item a check failure rather than nothing at all (SR-0042) — needs
# compose>=0.13.0, the release in which the union path began handing the published
# set to the validator. Below it the graph still loads and checks; the coverage half
# of the gate is simply silent, which is the defect SR-0042 exists to close.
# That floor carries throughline's with it: compose 0.13.0 itself requires >=1.13.2,
# so the pair (compose==0.13.0, throughline==1.13.0) is unsatisfiable and the
# declared-minimum resolution SR-0038 installs would not resolve at all. 1.13.2 is
# therefore the honest floor here — not a version this package reaches for directly,
# but the lowest one its own declared minimum of compose can be installed against.
dependencies = ["throughline-compose>=0.13.0", "throughline>=1.13.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rhodium-org/throughline-ratify"
Repository = "https://github.com/rhodium-org/throughline-ratify"
Issues = "https://github.com/rhodium-org/throughline-ratify/issues"

[project.scripts]
tl-ratify = "throughline_ratify.cli:main"
throughline-ratify = "throughline_ratify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
